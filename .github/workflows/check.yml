name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Windows GUI and release boundary
        shell: pwsh
        run: ./scripts/package.ps1 -Output .build/ci-package -SkipTests
