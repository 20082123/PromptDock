name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, must match version.go (for example 0.2.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Stable version required' }
          $text = Get-Content version.go -Raw
          if (-not $text.Contains('var appVersion = "' + $env:REQUESTED_VERSION + '"')) { throw 'Version mismatch' }
      - name: Build with explicit official repository
        shell: pwsh
        env:
          OFFICIAL_REPOSITORY: ${{ github.repository }}
        run: ./scripts/package.ps1 -OfficialRepository $env:OFFICIAL_REPOSITORY -Output .build/release-package
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            .build/release-package/*.zip
            .build/release-package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: gh release create "v$VERSION" release-files/*.zip release-files/SHA256SUMS.txt --draft --target "$COMMIT" --title "PromptDock $VERSION" --notes-file RELEASE_NOTES.md
